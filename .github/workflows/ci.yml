name: CI

# Build + test verification on every push and pull request.
# This is the compile/test gate that runs BEFORE a release is tagged — it does NOT
# publish anything (no release, no version). The release workflow (release.yml) handles
# tag-triggered publishing. Having this means branch/PR changes are compile-verified
# without having to cut a user-facing release first.

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'perf/**'
      - 'refactor/**'
      - 'docs/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 9
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/DLSSVersionToolkit.sln

      - name: Build
        run: dotnet build src/DLSSVersionToolkit.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/DLSSVersionToolkit.sln --configuration Release --no-build --verbosity normal
