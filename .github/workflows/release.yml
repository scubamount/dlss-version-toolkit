name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/DLSSVersionToolkit.sln

      - name: Build
        run: dotnet build src/DLSSVersionToolkit.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/DLSSVersionToolkit.sln --configuration Release --no-build --verbosity normal

      - name: Publish single-file exe
        run: >
          dotnet publish src/DLSSVersionToolkit/DLSSVersionToolkit.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:PublishSingleFile=true
          --output publish

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          cd publish
          sha256sum DLSSVersionToolkit.exe > DLSSVersionToolkit.exe.sha256
          echo "Checksum:"
          cat DLSSVersionToolkit.exe.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLSSVersionToolkit
          path: |
            publish/DLSSVersionToolkit.exe
            publish/DLSSVersionToolkit.exe.sha256

      - name: Attach exe + checksum to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # IMPORTANT: the in-app auto-updater (AppUpdateService.ExeAssetName) matches the
          # release asset by the EXACT name "DLSSVersionToolkit.exe". Do NOT rename this asset
          # (e.g. adding a version suffix) without updating ExeAssetName in lockstep, or older
          # installed versions will silently fail to find the update.
          # The .sha256 file is verified by AppUpdateService.DownloadAndApplyAsync before
          # executing the downloaded exe (integrity gate — see v0.0.35.3).
          files: |
            publish/DLSSVersionToolkit.exe
            publish/DLSSVersionToolkit.exe.sha256
          fail_on_unmatched_files: true
