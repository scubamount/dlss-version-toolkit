name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/DLSSVersionToolkit.sln

      - name: Build
        run: dotnet build src/DLSSVersionToolkit.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/DLSSVersionToolkit.sln --configuration Release --no-build --verbosity normal

      - name: Publish single-file exe
        run: >
          dotnet publish src/DLSSVersionToolkit/DLSSVersionToolkit.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:PublishSingleFile=true
          --output publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLSSVersionToolkit
          path: publish/DLSSVersionToolkit.exe

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/DLSSVersionToolkit.exe
          fail_on_unmatched_files: true
