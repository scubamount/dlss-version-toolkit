name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege: the build job (checkout, restore, compile, tests, publish) holds a
# read-only token, so no NuGet package, test or build step ever runs with a token that can
# write releases or push to main. Only the publish job gets contents: write, and it runs no
# project code: it downloads the build artifact, attaches it, and pins the manifests.
# Actions are pinned to full commit SHAs (tag in the trailing comment); dependabot bumps both.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 9
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/DLSSVersionToolkit.sln

      - name: Build
        run: dotnet build src/DLSSVersionToolkit.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/DLSSVersionToolkit.sln --configuration Release --no-build --verbosity normal

      - name: Publish single-file exe
        run: >
          dotnet publish src/DLSSVersionToolkit/DLSSVersionToolkit.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:PublishSingleFile=true
          --output publish

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          cd publish
          sha256sum DLSSVersionToolkit.exe > DLSSVersionToolkit.exe.sha256
          echo "Checksum:"
          cat DLSSVersionToolkit.exe.sha256

      # The single-file exe embeds its runtimeconfig, so the installed app's updater cannot see
      # which .NET runtime a new release needs until after it has swapped the exe in. Publishing
      # the config as its own asset lets AppUpdateService refuse an update the machine cannot
      # run (e.g. a future net10 build on a .NET 9-only machine) instead of bricking the install.
      - name: Attach runtime requirements
        shell: bash
        run: |
          set -euo pipefail
          CFG=$(find src/DLSSVersionToolkit/bin/Release -name DLSSVersionToolkit.runtimeconfig.json | head -1)
          [ -n "$CFG" ]
          cp "$CFG" publish/DLSSVersionToolkit.runtimeconfig.json
          cat publish/DLSSVersionToolkit.runtimeconfig.json
          # Covers every file that crosses into the publish job; not itself a release asset.
          (cd publish && sha256sum DLSSVersionToolkit.exe DLSSVersionToolkit.runtimeconfig.json > artifact.sha256)

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DLSSVersionToolkit
          if-no-files-found: error
          path: |
            publish/DLSSVersionToolkit.exe
            publish/DLSSVersionToolkit.exe.sha256
            publish/DLSSVersionToolkit.runtimeconfig.json
            publish/artifact.sha256

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DLSSVersionToolkit
          path: publish

      # The artifact crossed a job boundary: re-check the bytes against the checksum the build
      # job computed before anything is published or pinned.
      - name: Verify artifact checksum
        run: cd publish && sha256sum -c artifact.sha256 && sha256sum -c DLSSVersionToolkit.exe.sha256

      - name: Attach exe + checksum to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # IMPORTANT: the in-app auto-updater (AppUpdateService.ExeAssetName) matches the
          # release asset by the EXACT name "DLSSVersionToolkit.exe". Do NOT rename this asset
          # (e.g. adding a version suffix) without updating ExeAssetName in lockstep, or older
          # installed versions will silently fail to find the update.
          # The .sha256 file is verified by AppUpdateService.DownloadAndApplyAsync before
          # executing the downloaded exe (integrity gate — see v0.0.35.3). The runtimeconfig
          # is read by AppUpdateService.CheckForUpdateAsync before any download (v0.78).
          files: |
            publish/DLSSVersionToolkit.exe
            publish/DLSSVersionToolkit.exe.sha256
            publish/DLSSVersionToolkit.runtimeconfig.json
          fail_on_unmatched_files: true

      # The manifests MUST hash the bytes this workflow built and uploaded. Before this step,
      # hashes were hand-written from local rebuilds: v0.0.59-v0.0.62 all pinned one stale
      # v0.0.13-era hash, and v0.63 pinned a locally-rebuilt exe's hash — no release ever
      # matched. CI hashing its own artifact makes that class of staleness impossible.
      # NOTE: lowercase hex — winget and scoop both accept it; hand-written uppercase did not
      # help anything.
      - name: Pin winget + scoop manifests to this release
        shell: bash
        # No ${{ }} interpolation in this script: only Actions-provided env vars
        # (GITHUB_REF_NAME = the tag pushed by a write-permitted principal, GITHUB_REPOSITORY
        # = this repo) and the locally-computed SHA. Nothing event-payload-derived reaches bash.
        run: |
          set -euo pipefail
          SHA=$(awk '{print tolower($1)}' publish/DLSSVersionToolkit.exe.sha256)
          [ "${#SHA}" -eq 64 ]
          TAG=${GITHUB_REF_NAME#v}
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/DLSSVersionToolkit.exe"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD
          sed -i "s|^PackageVersion: .*|PackageVersion: ${TAG}|; s|^  InstallerUrl: .*|  InstallerUrl: ${URL}|; s|^  InstallerSha256: .*|  InstallerSha256: ${SHA}|" winget/dlss-version-toolkit.yaml
          # The url substitution is anchored to the exe URL on purpose: the file has a second
          # "url" (checkver, pointing at /releases/latest) that must survive.
          sed -i "s|\"version\": \"[^\"]*\"|\"version\": \"${TAG}\"|; s|\"url\": \"[^\"]*DLSSVersionToolkit\.exe\"|\"url\": \"${URL}\"|; s|\"hash\": \"[^\"]*\"|\"hash\": \"${SHA}\"|" bucket/dlss-version-toolkit.json
          if git diff --quiet; then echo "manifests already pinned to ${GITHUB_REF_NAME}"; exit 0; fi
          git add winget/dlss-version-toolkit.yaml bucket/dlss-version-toolkit.json
          git commit -m "chore(release): pin manifests to ${GITHUB_REF_NAME} [skip ci]"
          git push origin HEAD:main
